name: Verify and deploy to 1Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codes123-production
  cancel-in-progress: true

jobs:
  build:
    name: Test and build release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: quant-service/go.mod
          cache-dependency-path: quant-service/go.sum

      - name: Test and build frontend
        env:
          VITE_QUANT_MONITOR_URL: /api/quant/monitor
          VITE_QUANT_SYNC_URL: /api/quant/sync
          VITE_QUANT_OPTIMIZE_URL: /api/quant/optimize
        run: |
          npm ci
          npm run lint --if-present
          npm run build

      - name: Test Go quant service
        working-directory: quant-service
        env:
          CGO_ENABLED: 1
        run: go test ./...

      - name: Build Linux Go quant service
        working-directory: quant-service
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../release
          go build -trimpath -ldflags='-s -w' -o ../release/quant-service ./cmd/quant-service

      - name: Package immutable release
        run: |
          tar -czf release/frontend.tar.gz -C dist/client .
          cp quant-service/deploy/remote-deploy.sh release/remote-deploy.sh
          cp quant-service/deploy/start-quant-service.sh release/start-quant-service.sh
          chmod 755 release/quant-service release/remote-deploy.sh release/start-quant-service.sh
          test -s release/quant-service
          test -s release/frontend.tar.gz
          bash -n release/remote-deploy.sh release/start-quant-service.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to 1Panel server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_ROOT: /home/deploy/cv
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-release-${{ github.sha }}
          path: release

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_ROOT/releases/$RELEASE_SHA' '$DEPLOY_ROOT/env' '$DEPLOY_ROOT/data' '$DEPLOY_ROOT/bin' '$DEPLOY_ROOT/run' '$DEPLOY_ROOT/logs' && chmod 700 '$DEPLOY_ROOT/env'"
          rsync -a --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            release/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/releases/$RELEASE_SHA/"

      - name: Activate release and restart Go service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_ROOT/releases/$RELEASE_SHA/remote-deploy.sh' '$RELEASE_SHA'"

      - name: Verify public site and API
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            https://codes123.cn/ >/dev/null
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            https://codes123.cn/api/quant/monitor >/dev/null
          echo 'codes123.cn frontend and quant API are healthy'
